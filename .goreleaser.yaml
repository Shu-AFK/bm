version: 2

project_name: bm

release:
  github:
    owner: Shu-AFK
    name: bm

builds:
  - id: bm
    main: main.go
    binary: bm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    ids:
      - bm
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
      - assets/**

nfpms:
  - id: linux_pkgs
    ids:
      - bm
    package_name: bm
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    description: "Your command-line sidekick for teleporting to files, folders, and URLs in one hop."
    maintainer: "Floyd Göttsch <floyd.goettsch1@gmail.com>"
    homepage: "https://github.com/Shu-AFK/bm"
    license: "MIT"
    formats:
      - deb
      - rpm
      - archlinux

brews:
  - name: bm
    repository:
      owner: Shu-AFK
      name: homebrew-tap
    description: "Your command-line sidekick for teleporting to files, folders, and URLs in one hop."
    homepage: "https://github.com/Shu-AFK/bm"
    license: "MIT"
    commit_author:
      name: "CI Bot"
      email: "bm-release-bot@users.noreply.github.com"
    install: |
      bin.install "bm"
    test: |
      system "#{bin}/bm", "--version"

scoops:
  - name: bm
    repository:
      owner: Shu-AFK
      name: scoop-bucket
    homepage: "https://github.com/Shu-AFK/bm"
    description: "Your command-line sidekick for teleporting to files, folders, and URLs in one hop."
    license: MIT
    url_template: "https://github.com/Shu-AFK/bm/releases/download/{{ .Tag }}/{{ .ArtifactName }}"

aurs:
  - name: bm-bin
    homepage: "https://github.com/Shu-AFK/bm"
    description: "Your command-line sidekick for teleporting to files, folders, and URLs in one hop."
    maintainers:
      - "Floyd Göttsch <floyd.goettsch1@gmail.com>"
    license: MIT
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/bm-bin.git"
    provides:
      - bm
    conflicts:
      - bm
